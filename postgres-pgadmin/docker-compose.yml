
services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    env_file:
      - pg-env.list
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      - pgnetwork

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    hostname: pgadmin4
    restart: unless-stopped
    env_file:
      - pgadmin-env.list
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pgnetwork

networks:
  pgnetwork:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:

