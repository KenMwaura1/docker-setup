# config file for prometheus

# global config
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - follow_redirects: true
    enable_http2: true
    scheme: http
    timeout: 10s
    api_version: v2
    static_configs:
    - targets: []
scrape_configs:
- job_name: prometheus
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  follow_redirects: true
  enable_http2: true
  static_configs:
  - targets:
    - localhost:9090

- job_name: json
  metrics_path: /probe
  params:
    # The name of the module defined by json-exporter-config.yaml
    module: [jellyfin]
  static_configs:
    - targets:
      # Use the Sessions endpoint to see actively playing items
      - http://192.168.100.16:8096/Sessions
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      replacement: localhost:9115 # The exporter's hostname:port

- job_name: jellyfin
  static_configs:
    - targets:
      - 0.0.0.0:8080  

- job_name: node
  static_configs:
    - targets:
      - 0.0.0.0:9100